name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f ConsentScreenShare/settings.gradle.kts ]; then
            echo "dir=ConsentScreenShare" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Android Gradle project not found."
            echo "Check settings.gradle.kts and repository folders."
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearView-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
